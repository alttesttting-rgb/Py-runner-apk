name: Build PinkPy Runner APK

on:
  push:
    branches: [ main ]
    paths:
      - 'PinkPyRunner/**'
      - '.github/workflows/build-pinkpy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build ARM64 debug APK
        run: gradle -p PinkPyRunner assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PinkPyRunner-APK
          path: PinkPyRunner/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
