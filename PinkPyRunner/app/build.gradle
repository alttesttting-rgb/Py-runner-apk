plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.pinkpy.runner'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pinkpy.runner'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = '3.13'
        pip {
            install 'requests'
            install 'httpx'
            install 'beautifulsoup4'
            install 'certifi'
            install 'urllib3'
            install 'python-dateutil'
            install 'pytz'
            install 'PyYAML'
            install 'websocket-client'
            install 'typing-extensions'
        }
    }
}
