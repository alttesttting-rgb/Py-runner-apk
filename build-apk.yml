name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unzip project
        run: |
          echo "Looking for zip..."
          ls -la
          unzip -o pyrunner.zip -d extracted
          echo "Contents of extracted:"
          ls -la extracted
          # Move everything to the root
          if [ -d extracted/PyRunner ]; then
            cp -r extracted/PyRunner/* .
          elif [ -d extracted/app ]; then
            cp -r extracted/* .
          else
            cp -r extracted/* .
          fi
          echo "Root after copy:"
          ls -la

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create Gradle wrapper if missing
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PyRunner-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
